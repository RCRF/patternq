[project]
name = "patternq"
version = "0.3.0"
description = "Query and analysis tools for the Pattern Data Commons and its UnifyBio components."
authors = [{ name = "Benjamin Kamphaus", email = "ben@vendekagonlabs.com" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.26.0",
    "pandas>=2.0.1",
    "plotly>=5.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# optional transit response formats (query(..., format="transit+json" / "transit+msgpack"))
transit = ["transit-python[msgpack]>=0.8.321; python_version >= '3.10'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["patternq"]

[tool.pytest.ini_options]
markers = [
    "live: queries the live query service (needs PATTERNQ_API_KEY)",
    "slow: large datasets (tcga-brca, painter); opt in with -m slow",
]
